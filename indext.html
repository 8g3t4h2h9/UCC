<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultimate Card Club</title>
<style>
  :root{
    --bg:#101014; --panel:#1a1a20; --panel2:#212129; --border:#2c2c34;
    --text:#f0f0f2; --muted:#9a9aa5; --accent:#3fae6a; --accent2:#2f8a53;
    --danger:#d9534f; --gold:#d4af37;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--border);
  }
  header h1{font-size:18px; margin:0; letter-spacing:0.5px;}
  nav{display:flex; gap:6px;}
  nav button{
    background:none; border:1px solid var(--border); color:var(--muted);
    padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  nav button.active{background:var(--accent); color:#08210f; border-color:var(--accent); font-weight:600;}
  main{padding:24px; max-width:1000px; margin:0 auto;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:12px; cursor:pointer; transition:border-color .15s;
    display:flex; flex-direction:column; gap:6px;
  }
  .card:hover{border-color:var(--accent);}
  .card.selected{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
  .card .rating{font-size:26px; font-weight:700;}
  .card .pos{font-size:12px; color:var(--accent); font-weight:600;}
  .card .name{font-size:14px; font-weight:600;}
  .card .rev{font-size:11px; color:var(--muted); text-transform:uppercase;}
  .card-img{
    width:100%; height:100px; border-radius:6px; object-fit:cover;
    background:var(--panel2);
  }
  .card-img-placeholder{
    width:100%; height:100px; border-radius:6px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:11px; text-transform:uppercase;
  }
  .stats{
    display:grid; grid-template-columns:1fr 1fr; gap:2px 8px;
    margin-top:4px; padding-top:8px; border-top:1px solid var(--border);
  }
  .stat-row{
    display:flex; justify-content:space-between; font-size:11px;
  }
  .stat-row .label{color:var(--muted);}
  .stat-row .val{font-weight:600;}
  .pitch{
    position:relative; width:100%; aspect-ratio:2/3; max-width:520px; margin:0 auto;
    background:
      repeating-linear-gradient(180deg, #1e5c33 0, #1e5c33 10%, #226635 10%, #226635 20%);
    border:2px solid rgba(255,255,255,0.4); border-radius:8px; overflow:hidden;
  }
  .pitch::before{
    content:""; position:absolute; top:50%; left:0; right:0; height:1px;
    background:rgba(255,255,255,0.4);
  }
  .pitch::after{
    content:""; position:absolute; top:50%; left:50%; width:70px; height:70px;
    border:1px solid rgba(255,255,255,0.4); border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .slot{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    cursor:pointer; width:78px;
  }
  .slot .slot-square{
    width:48px; height:48px; border-radius:8px; background:var(--panel);
    border:2px solid var(--gold); position:relative; overflow:hidden;
  }
  .slot .slot-square img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .slot .slot-square .no-img{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--muted); text-transform:uppercase;
  }
  .slot .rating-badge{
    position:absolute; top:2px; left:2px; background:rgba(0,0,0,0.75); color:#fff;
    font-size:11px; font-weight:700; padding:1px 4px; border-radius:4px; line-height:1.3;
  }
  .slot .slot-name{
    font-size:10px; color:#fff; text-align:center; background:rgba(0,0,0,0.55);
    padding:1px 4px; border-radius:4px; max-width:78px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .slot .slot-pos{font-size:9px; color:var(--gold); font-weight:600;}
  .pack-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:16px; text-align:center; display:flex; flex-direction:column; gap:8px;
  }
  .pack-icon{
    width:90px; height:auto; margin:0 auto 4px; display:block;
  }
  .pack-card .pack-title{font-size:15px; font-weight:700;}
  .pack-card .pack-desc{font-size:12px; color:var(--muted);}
  .pack-card .pack-cost{font-size:13px; color:var(--gold); font-weight:600;}
  .reveal-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .reveal-card{
    background:var(--panel2); border:1px solid var(--gold); border-radius:8px;
    padding:10px; text-align:center;
  }
  .reveal-card .rating{font-size:22px; font-weight:700;}
  .reveal-card .pos{font-size:11px; color:var(--accent); font-weight:600;}
  .reveal-card .name{font-size:12px; font-weight:600; margin-top:2px;}
  .panel-box{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:18px; margin-bottom:16px;
  }
  .item-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .item-row:last-child{border-bottom:none;}
  .qty{background:var(--panel2); padding:2px 10px; border-radius:12px; font-size:12px;}
  button.primary{
    background:var(--accent); color:#08210f; border:none; padding:9px 16px;
    border-radius:6px; font-weight:600; cursor:pointer; font-size:13px;
  }
  button.primary:disabled{background:#3a3a42; color:var(--muted); cursor:not-allowed;}
  button.secondary{
    background:none; border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    padding:8px 10px; border-radius:6px; font-size:13px;
  }
  .empty{color:var(--muted); text-align:center; padding:40px 0; font-size:14px;}
  .log{font-size:12px; color:var(--muted); margin-top:10px; min-height:16px;}
  .log.ok{color:var(--accent);}
  .log.err{color:var(--danger);}
  h2{font-size:15px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
</style>
</head>
<body>

<header>
  <h1>Ultimate Card Club</h1>
  <nav>
    <button data-view="club" class="active">Club</button>
    <button data-view="formation">Formation</button>
    <button data-view="packs">Packs</button>
    <button data-view="consumables">Consumables</button>
    <button id="reset-progress-btn" style="border-color:var(--danger); color:var(--danger);">Reset</button>
  </nav>
</header>

<main>
  <section id="view-club">
    <h2>Your cards</h2>
    <div id="club-grid" class="grid"></div>
    <h2 style="margin-top:20px;">Player detail</h2>
    <div id="player-detail" class="panel-box"></div>
  </section>

  <section id="view-formation" style="display:none;">
    <h2>Formation</h2>
    <div style="text-align:center; margin-bottom:14px;">
      <select id="formation-select" style="font-size:14px; padding:8px 12px;"></select>
    </div>
    <div id="pitch" class="pitch"></div>
    <div class="panel-box" style="margin-top:16px; text-align:center;">
      <button class="primary" id="play-match-btn">Play match</button>
      <div id="match-live" style="display:none; margin-top:16px; text-align:left;">
        <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted);">
          <span>Your Team</span>
          <span id="match-clock" style="font-weight:700; color:var(--text);">0'</span>
          <span>Opponent</span>
        </div>
        <div id="match-score" style="font-size:32px; font-weight:700; text-align:center; margin:8px 0;">0 - 0</div>
        <div id="match-events" style="max-height:150px; overflow-y:auto; font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px;"></div>
      </div>
      <div id="match-result" class="log" style="margin-top:10px;"></div>
      <button class="secondary" id="view-stats-btn" style="display:none; margin-top:10px;">View match stats</button>
      <div id="match-stats-panel" style="display:none; margin-top:14px; text-align:left;"></div>
    </div>
    <h2 style="margin-top:20px;">Customise team</h2>
    <div id="squad-editor" class="panel-box"></div>
  </section>

  <section id="view-packs" style="display:none;">
    <h2>Coins: <span id="coin-balance"></span></h2>
    <div id="pack-shop" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); margin-bottom:20px;"></div>
    <h2>Pack results</h2>
    <div id="pack-results" class="panel-box"></div>
  </section>

  <section id="view-consumables" style="display:none;">
    <h2>Inventory</h2>
    <div id="inventory-box" class="panel-box"></div>

    <h2>Apply position modifier</h2>
    <div class="panel-box">
      <div id="apply-body"></div>
    </div>

    <h2>Apply stat boost</h2>
    <div class="panel-box">
      <div id="statboost-body"></div>
    </div>
  </section>
</main>

const FIRST_NAMES = ["Ari","Kade","Ronan","Elis","Tobi","Marek","Dax","Iggy","Otis","Rune","Zeke","Finn","Cass","Theo","Ezra"];
const LAST_NAMES = ["Vantor","Brisk","Halden","Corren","Marsh","Kellow","Draven","Osric","Fenwick","Lark","Wren","Sable","Torvik","Quill","Ashby"];
const OUTFIELD_POOL = ["CB","LB","RB","CDM","CM","CAM","LM","RM","LW","RW","CF","ST"];

function randomName(){
  const f = FIRST_NAMES[Math.floor(Math.random()*FIRST_NAMES.length)];
  const l = LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)];
  return `${f} ${l}`;
}

function randInRange(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateStats(position, rating){
  const spread = () => Math.max(30, Math.min(99, rating + randInRange(-8, 8)));
  if(position === "GK"){
    return {Diving:spread(), Handling:spread(), Kicking:spread(), Reflexes:spread(), Speed:spread(), Positioning:spread()};
  }
  return {Speed:spread(), Shooting:spread(), Passing:spread(), Dribbling:spread(), Defending:spread(), Physical:spread()};
}

function revisionForRating(rating){
  if(rating >= 85) return "gold_rare";
  if(rating >= 75) return "gold_nonrare";
  if(rating >= 65) return "silver_rare";
  return "bronze_nonrare";
}

function generatePlayer(minRating, maxRating, gkChance){
  const rating = randInRange(minRating, maxRating);
  const position = Math.random() < gkChance ? "GK" : OUTFIELD_POOL[Math.floor(Math.random()*OUTFIELD_POOL.length)];
  const id = "c" + (nextCardNum++);
  return {
    id, name: randomName(), rating, preferredPosition: position,
    revision: revisionForRating(rating), stats: generateStats(position, rating)
  };
}

function createKymeraCard(){
  const id = "c" + (nextCardNum++);

    id, name:"Kymera", rating:87, preferredPosition:"ST", revision:"gold_rare", image:KYMERA_IMG,
    stats:{Speed:89, Shooting:88, Passing:75, Dribbling:86, Defending:40, Physical:78}
  };
}

function addConsumable(itemId, name, qty){
  let stack = consumables.inventory.find(c => c.itemId === itemId);
  if(!stack){
    stack = {itemId, name, quantity:0};
    consumables.inventory.push(stack);
  }
  stack.quantity += qty;
}

function renderPackShop(){
  document.getElementById("coin-balance").textContent = coins.toLocaleString();
  const shop = document.getElementById("pack-shop");
  shop.innerHTML = "";
  PACK_TYPES.forEach(pack => {
    const el = document.createElement("div");
    el.className = "pack-card";
    el.innerHTML = `
      <img class="pack-icon" src="${PACK_ICON}" alt="${pack.name}">
      <div class="pack-title">${pack.name}</div>
      <div class="pack-desc">${pack.desc}</div>
      <div class="pack-cost">${pack.cost.toLocaleString()} coins</div>
      <button class="primary" ${coins < pack.cost ? "disabled" : ""}>Open pack</button>
    `;
    el.querySelector("button").onclick = () => openPack(pack);
    shop.appendChild(el);
  });
  saveState();
}

let pendingPackPlayers = [];

function openPack(pack){
  if(coins < pack.cost) return;
  coins -= pack.cost;
  const results = document.getElementById("pack-results");

  if(pack.type === "consumable"){
    addConsumable(pack.itemId, pack.itemName, pack.quantity);
    renderPackShop();
    results.innerHTML = `
      <div class="reveal-grid">
        <div class="reveal-card">
          <div class="rating">x${pack.quantity}</div>
          <div class="pos">Consumable</div>
          <div class="name">${pack.itemName}</div>
        </div>
      </div>
    `;
    return;
  }

  for(let i = 0; i < pack.size; i++){
    pendingPackPlayers.push(generatePlayer(pack.min, pack.max, pack.gkChance));
  }
  if(pack.id === "prime" && Math.random() < 0.01){
    const swapIndex = pendingPackPlayers.length - pack.size + randInRange(0, pack.size - 1);
    pendingPackPlayers[swapIndex] = createKymeraCard();
  }
  renderPackShop();
  renderPackResults();
}

function renderPackResults(){
  const results = document.getElementById("pack-results");
  if(pendingPackPlayers.length === 0){
    results.innerHTML = '<div class="empty">Open a pack to see your pulls here.</div>';
    return;
  }
  results.innerHTML = `
    <div class="reveal-grid">
      ${pendingPackPlayers.map(p => `
        <div class="reveal-card" ${p.image ? 'style="border-color:var(--gold); box-shadow:0 0 8px rgba(212,175,55,0.5);"' : ""}>
          ${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%; height:70px; object-fit:cover; border-radius:6px; margin-bottom:6px;">` : ""}
          <div class="rating">${p.rating}</div>
          <div class="pos">${p.preferredPosition}</div>
          <div class="name">${p.name}</div>
        </div>
      `).join("")}
    </div>
    <div style="margin-top:14px; text-align:center;">
      <button class="primary" id="add-to-club-btn">Add to club</button>
    </div>
  `;
  document.getElementById("add-to-club-btn").onclick = () => {
    players.push(...pendingPackPlayers);
    pendingPackPlayers = [];
    renderPackResults();
  };
}

const POSITION_COORDS = {
  GK:{x:50,y:5}, CB:{x:50,y:20}, LB:{x:15,y:25}, RB:{x:85,y:25},
  LWB:{x:15,y:35}, RWB:{x:85,y:35}, CDM:{x:50,y:40}, CM:{x:50,y:50},
  CAM:{x:50,y:60}, LM:{x:15,y:55}, RM:{x:85,y:55}, LW:{x:15,y:80},
  RW:{x:85,y:80}, CF:{x:50,y:85}, ST:{x:50,y:95}
};

const MAX_POS_DISTANCE = (() => {
  const keys = Object.keys(POSITION_COORDS);
  let max = 0;
  keys.forEach(a => keys.forEach(b => {
    const dx = POSITION_COORDS[a].x - POSITION_COORDS[b].x;
    const dy = POSITION_COORDS[a].y - POSITION_COORDS[b].y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d > max) max = d;
  }));
  return max;
})();

const MAX_OOP_PENALTY = 20;

function positionPenalty(fromPos, toPos){
  if(!fromPos || !toPos || fromPos === toPos) return 0;
  const a = POSITION_COORDS[fromPos];
  const b = POSITION_COORDS[toPos];
  if(!a || !b) return 0;
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  return Math.round((dist / MAX_POS_DISTANCE) * MAX_OOP_PENALTY);
}

function effectiveRating(player, slotPos){
  const penalty = positionPenalty(player.preferredPosition, slotPos);
  return Math.max(1, player.rating - penalty);
}

let squad = new Array(currentSlots().length).fill(null);

function autoFillSquad(){
  const used = new Set();
  squad = currentSlots().map(slot => {
    const player = players.find(p => p.preferredPosition === slot.matchPos && !used.has(p.id));
    if(player){ used.add(player.id); return player.id; }
    return null;
  });
}
autoFillSquad();

const SAVE_KEY = "ultimateCardClub_save_v1";

function saveState(){
  try{
    const state = { players, consumables, coins, squad, currentFormationKey, nextCardNum };
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch(e){
    // storage unavailable — game just won't persist this session
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const state = JSON.parse(raw);
    if(Array.isArray(state.players)) players = state.players;
    if(state.consumables && Array.isArray(state.consumables.inventory)) consumables = state.consumables;
    if(typeof state.coins === "number") coins = state.coins;
    if(state.currentFormationKey && FORMATIONS[state.currentFormationKey]) currentFormationKey = state.currentFormationKey;
    if(Array.isArray(state.squad) && state.squad.length === currentSlots().length) squad = state.squad;
    if(typeof state.nextCardNum === "number") nextCardNum = state.nextCardNum;
    return true;
  } catch(e){
    return false;
  }
}

let resetConfirmTimeout = null;

function resetProgress(){
  const btn = document.getElementById("reset-progress-btn");
  if(btn.dataset.confirming === "true"){
    clearTimeout(resetConfirmTimeout);
    try{ localStorage.removeItem(SAVE_KEY); } catch(e){}
    location.reload();
    return;
  }
  btn.dataset.confirming = "true";
  btn.textContent = "Click again to confirm";
  resetConfirmTimeout = setTimeout(() => {
    btn.dataset.confirming = "false";
    btn.textContent = "Reset";
  }, 4000);
}

function changeFormation(newKey){
  if(!FORMATIONS[newKey] || newKey === currentFormationKey) return;
  const previousSlots = currentSlots();
  const previousSquad = squad;
  const previousPlayers = previousSlots.map((slot, i) => previousSquad[i] ? findCard(previousSquad[i]) : null);

  currentFormationKey = newKey;
  const newSlots = currentSlots();
  const used = new Set();
  squad = newSlots.map(slot => {
    let idx = previousPlayers.findIndex((p, i) => p && p.preferredPosition === slot.matchPos && !used.has(p.id));
    if(idx === -1){
      idx = previousPlayers.findIndex(p => p && !used.has(p.id));
    }
    if(idx !== -1){
      used.add(previousPlayers[idx].id);
      return previousPlayers[idx].id;
    }
    return null;
  });
}

function renderFormationSelect(){
  const sel = document.getElementById("formation-select");
  if(sel.dataset.built !== "true"){
    sel.innerHTML = Object.keys(FORMATIONS).map(key =>

    ).join("");
    sel.dataset.built = "true";
    sel.onchange = () => {

let matchInProgress = false;

function updateMatchButtonState(){
  const btn = document.getElementById("play-match-btn");
  const count = filledSquadCount();
  if(matchInProgress) return;
  btn.disabled = count < 11;
  const resultEl = document.getElementById("match-result");
  if(count < 11 && !resultEl.classList.contains("err")){
    resultEl.className = "log";
    resultEl.textContent = `${count}/11 slots filled — fill your squad in Customise team to play.`;
  } else if(count === 11 && resultEl.textContent.includes("slots filled")){
    resultEl.className = "log";
    resultEl.textContent = "";
  }
}

function renderSquadEditor(){
  const box = document.getElementById("squad-editor");
  const sortedPlayers = players.slice().sort((a, b) => b.rating - a.rating);
  box.innerHTML = currentSlots().map((slot, i) => {
    const currentId = squad[i] || "";
    const options = sortedPlayers.map(p => {
      const penalty = positionPenalty(p.preferredPosition, slot.matchPos);
      const label = penalty > 0
        ? `${p.name} (${p.rating}→${effectiveRating(p, slot.matchPos)} ${p.preferredPosition})`
        : `${p.name} (${p.rating} ${p.preferredPosition})`;
      return `<option value="${p.id}" ${p.id === currentId ? "selected" : ""}>${label}</option>`;
    }).join("");
    return `
      <div class="item-row">
        <span style="min-width:40px; color:var(--accent); font-weight:600;">${slot.matchPos}</span>
        <select data-slot="${i}" style="flex:1; margin-left:10px;">
          <option value="">Empty</option>
          ${options}
        </select>
      </div>
    `;
  }).join("");
  box.querySelectorAll("select").forEach(sel => {
    sel.onchange = () => {
      const slotIndex = parseInt(sel.dataset.slot, 10);
      const newId = sel.value || null;
      if(newId){
        squad = squad.map(id => id === newId ? null : id);
      }
      squad[slotIndex] = newId;
      renderFormation();
    };
  });
}

function filledSquadCount(){
  return squad.filter(id => id !== null).length;
}

function getSquadPlayers(){
  return currentSlots()
    .map((slot, i) => ({slot, player: squad[i] ? findCard(squad[i]) : null}))
    .filter(sp => sp.player);
}

const ATTACK_WEIGHTS = {ST:5, CF:5, LW:4, RW:4, CAM:4, CM:2, RM:2, LM:2, CDM:1, CB:0.5, LB:0.5, RB:0.5, LWB:0.5, RWB:0.5, GK:0.05};
const ASSIST_WEIGHTS = {CAM:5, CM:4, RM:4, LM:4, RW:3, LW:3, CDM:2, ST:2, CF:2, CB:1, LB:1, RB:1, LWB:1, RWB:1, GK:0.05};

function pickWeighted(items, weightFn){
  const weights = items.map(weightFn);
  const total = weights.reduce((a, b) => a + b, 0);
  if(total <= 0) return items[Math.floor(Math.random() * items.length)];
  let r = Math.random() * total;
  for(let i = 0; i < items.length; i++){
    r -= weights[i];
    if(r <= 0) return items[i];
  }
  return items[items.length - 1];
}

let matchStatsMap = {};
let lastSquadPlayers = [];

function playMatch(){
  if(matchInProgress) return;
  if(filledSquadCount() < 11){
    const resultEl = document.getElementById("match-result");
    resultEl.className = "log err";
    resultEl.textContent = `You need a full 11-player squad to play a match (currently ${filledSquadCount()}/11). Fill every slot in Customise team.`;
    return;
  }

  const squadPlayers = getSquadPlayers();
  lastSquadPlayers = squadPlayers;
  matchStatsMap = {};
  squadPlayers.forEach(sp => { matchStatsMap[sp.player.id] = {goals:0, assists:0}; });

  const homeGoalsTotal = randInRange(0, 4);
  const awayGoalsTotal = randInRange(0, 4);

  const events = [];
  for(let i = 0; i < homeGoalsTotal; i++){
    const scorer = pickWeighted(squadPlayers, sp => ATTACK_WEIGHTS[sp.slot.matchPos] || 1);
    let assist = null;
    if(Math.random() < 0.8){
      const assistCandidates = squadPlayers.filter(sp => sp.player.id !== scorer.player.id);
      if(assistCandidates.length > 0){
        assist = pickWeighted(assistCandidates, sp => ASSIST_WEIGHTS[sp.slot.matchPos] || 1);
      }
    }
    events.push({minute: randInRange(1, 90), team: "home", scorer, assist});
  }
  for(let i = 0; i < awayGoalsTotal; i++){
    events.push({minute: randInRange(1, 90), team: "away"});
  }
  events.sort((a, b) => a.minute - b.minute);

  matchInProgress = true;
  const btn = document.getElementById("play-match-btn");
  btn.disabled = true;
  btn.textContent = "Match in progress...";

  const liveBox = document.getElementById("match-live");
  const clockEl = document.getElementById("match-clock");
  const scoreEl = document.getElementById("match-score");
  const eventsEl = document.getElementById("match-events");
  const resultEl = document.getElementById("match-result");
  const statsBtn = document.getElementById("view-stats-btn");
  const statsPanel = document.getElementById("match-stats-panel");

  liveBox.style.display = "block";
  resultEl.className = "log";
  resultEl.textContent = "";
  clockEl.textContent = "0'";
  scoreEl.textContent = "0 - 0";
  eventsEl.innerHTML = "";
  statsBtn.style.display = "none";
  statsPanel.style.display = "none";

  let minute = 0;
  let homeScore = 0;
  let awayScore = 0;

  const timer = setInterval(() => {
    minute++;
    clockEl.textContent = minute + "'";

    events.filter(e => e.minute === minute).forEach(e => {
      const line = document.createElement("div");
      if(e.team === "home"){
        homeScore++;
        matchStatsMap[e.scorer.player.id].goals++;
        let text = `${minute}' ⚽ ${e.scorer.player.name} scores!`;
        if(e.assist){
          matchStatsMap[e.assist.player.id].assists++;
          text += ` Assist: ${e.assist.player.name}.`;
        } else {
          text += ` Unassisted.`;
        }
        text += ` ${homeScore}-${awayScore}`;
        line.textContent = text;
        line.style.color = "var(--accent)";
      } else {
        awayScore++;
        line.textContent = `${minute}' 😟 Opponent scores. ${homeScore}-${awayScore}`;
        line.style.color = "var(--danger)";
      }
      scoreEl.textContent = `${homeScore} - ${awayScore}`;
      eventsEl.appendChild(line);
      eventsEl.scrollTop = eventsEl.scrollHeight;
    });

    if(minute >= 90){
      clearInterval(timer);
      finalizeMatch(homeScore, awayScore);
    }
  }, 70);
}

function renderMatchStatsPanel(){
  const panel = document.getElementById("match-stats-panel");
  const rows = lastSquadPlayers.map(sp => {
    const stat = matchStatsMap[sp.player.id] || {goals:0, assists:0};
    const rating = effectiveRating(sp.player, sp.slot.matchPos);
    return `
      <div class="item-row">
        <span style="min-width:36px; color:var(--accent); font-weight:600;">${sp.slot.matchPos}</span>
        <span style="flex:1; margin-left:10px;">${sp.player.name}</span>
        <span style="width:36px; text-align:center;">${rating}</span>
        <span style="width:60px; text-align:center; color:var(--muted);">${stat.goals} G</span>
        <span style="width:60px; text-align:center; color:var(--muted);">${stat.assists} A</span>
      </div>
    `;
  }).join("");
  panel.innerHTML = `<div class="panel-box">${rows}</div>`;
}

function finalizeMatch(homeGoals, awayGoals){
  let baseCoins = 120;
  let outcome;
  if(homeGoals > awayGoals){
    outcome = "Win";
    baseCoins += 150;
  } else if(homeGoals === awayGoals){
    outcome = "Draw";
    baseCoins += 60;
  } else {
    outcome = "Loss";
    baseCoins += 20;
  }
  const earned = baseCoins + randInRange(0, 80);
  coins += earned;
  addConsumable("PM_UNIVERSAL", "Position modifier", 1);

  const resultEl = document.getElementById("match-result");
  resultEl.className = "log ok";
  resultEl.textContent = `Full time: ${outcome} ${homeGoals}-${awayGoals} — earned ${earned.toLocaleString()} coins and 1 position modifier.`;

  const statsBtn = document.getElementById("view-stats-btn");
  statsBtn.style.display = "inline-block";
  statsBtn.onclick = () => {
    const panel = document.getElementById("match-stats-panel");
    const showing = panel.style.display === "block";
    if(showing){
      panel.style.display = "none";
    } else {
      renderMatchStatsPanel();
      panel.style.display = "block";
    }
  };

  matchInProgress = false;
  const btn = document.getElementById("play-match-btn");
  btn.textContent = "Play match";
  updateMatchButtonState();
  renderPackShop();
}

function switchView(view){
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.getElementById("view-club").style.display = view === "club" ? "block" : "none";
  document.getElementById("view-formation").style.display = view === "formation" ? "block" : "none";
  document.getElementById("view-packs").style.display = view === "packs" ? "block" : "none";
  document.getElementById("view-consumables").style.display = view === "consumables" ? "block" : "none";
  if(view === "club") renderClub();
  if(view === "formation") renderFormation();
  if(view === "packs"){
    renderPackShop();
    renderPackResults();
  }
  if(view === "consumables"){
    renderInventory();
    renderApplyPanel();
    renderStatBoostPanel();
  }
}

function findCard(id){ return players.find(p => p.id === id); }

function renderClub(){
  const grid = document.getElementById("club-grid");
  grid.innerHTML = "";
  if(players.length === 0){
    grid.innerHTML = '<div class="empty">No cards yet.</div>';
    renderPlayerDetail();
    saveState();
    return;
  }
  players.forEach(p => {
    const el = document.createElement("div");
    el.className = "card" + (p.id === selectedCardId ? " selected" : "");
    const imgHtml = p.image
      ? `<img class="card-img" src="${p.image}" alt="${p.name}">`
      : `<div class="card-img-placeholder">No image</div>`;
    const statsHtml = p.stats
      ? `<div class="stats">${Object.entries(p.stats).map(([k,v]) =>
          `<div class="stat-row"><span class="label">${k}</span><span class="val">${v}</span></div>`
        ).join("")}</div>`
      : "";
    el.innerHTML = `
      ${imgHtml}
      <div class="rating">${p.rating}</div>
      <div class="pos">${p.preferredPosition}</div>
      <div class="name">${p.name}</div>
      <div class="rev">${p.revision.replace("_"," ")}</div>
      ${statsHtml}
    `;
    el.onclick = () => {
      selectedCardId = p.id;
      renderClub();
      renderPlayerDetail();
      renderApplyPanel();
      renderStatBoostPanel();
    };
    grid.appendChild(el);
  });
  renderPlayerDetail();
  saveState();
}

function renderPlayerDetail(){
  const box = document.getElementById("player-detail");
  const card = findCard(selectedCardId);
  if(!card){
    box.innerHTML = '<div class="empty">Select a card to see details.</div>';
    return;
  }
  const sellValue = FAST_SELL_VALUES[card.revision] || 100;
  box.innerHTML = `
    <p style="margin:0 0 6px; font-weight:600;">${card.name}</p>
    <p style="margin:0 0 12px; color:var(--muted); font-size:13px;">
      ${card.rating} OVR &middot; ${card.preferredPosition} &middot; ${card.revision.replace("_"," ")}
    </p>
    <button class="primary" id="fast-sell-btn">Fast sell for ${sellValue.toLocaleString()} coins</button>
    <div class="log" id="sell-log"></div>
  `;
  document.getElementById("fast-sell-btn").onclick = () => {
    players = players.filter(p => p.id !== card.id);
    squad = squad.map(sid => sid === card.id ? null : sid);
    coins += sellValue;
    if(selectedCardId === card.id) selectedCardId = null;
    renderClub();
    renderPackShop();
  };
}

function renderInventory(){
  const box = document.getElementById("inventory-box");
  box.innerHTML = "";
  if(consumables.inventory.length === 0){
    box.innerHTML = '<div class="empty">No consumables owned.</div>';
    saveState();
    return;
  }
  consumables.inventory.forEach(item => {
    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = `<span>${item.name}</span><span class="qty">x${item.quantity}</span>`;
    box.appendChild(row);
  });
  saveState();
}

function renderApplyPanel(){
  const body = document.getElementById("apply-body");
  const card = findCard(selectedCardId);
  const stack = consumables.inventory.find(c => c.itemId === "PM_UNIVERSAL");
  const owned = stack ? stack.quantity : 0;

  if(!card){
    body.innerHTML = '<div class="empty">Select a card from the Club tab first.</div>';
    return;
  }

  if(card.preferredPosition === "GK"){
    body.innerHTML = `
      <p style="color:var(--muted); font-size:13px;">Selected: <strong style="color:var(--text)">${card.name}</strong> (GK)</p>
      <p class="log err">Position modifiers cannot be used on goalkeepers.</p>
    `;
    return;
  }

  const options = OUTFIELD_POSITIONS
    .filter(pos => pos !== card.preferredPosition)
    .map(pos => `<option value="${pos}">${pos}</option>`)
    .join("");

  body.innerHTML = `
    <p style="color:var(--muted); font-size:13px; margin-bottom:14px;">
      Selected: <strong style="color:var(--text)">${card.name}</strong>
      (currently <strong style="color:var(--text)">${card.preferredPosition}</strong>) &middot;
      Owned modifiers: <strong style="color:var(--text)">${owned}</strong>
    </p>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <select id="pos-select">${options}</select>
      <button class="primary" id="apply-btn" ${owned <= 0 ? "disabled" : ""}>Apply modifier</button>
    </div>
    <div class="log" id="apply-log"></div>
  `;

  document.getElementById("apply-btn").onclick = () => {
    const chosen = document.getElementById("pos-select").value;
    const result = applyPositionModifier(card.id, chosen);
    const log = document.getElementById("apply-log");
    if(result.ok){
      log.className = "log ok";
      log.textContent = `Changed ${card.name} from ${result.oldPosition} to ${result.newPosition}. Modifier consumed.`;
    } else {
      log.className = "log err";
      log.textContent = result.error;
    }
    renderClub();
    renderInventory();
    renderApplyPanel();
  };
}

function applyPositionModifier(cardId, chosenPosition){
  const stack = consumables.inventory.find(c => c.itemId === "PM_UNIVERSAL");
  if(!stack || stack.quantity <= 0){
    return {ok:false, error:"No position modifiers available in inventory."};
  }
  const card = findCard(cardId);
  if(!card) return {ok:false, error:"Card not found."};
  if(card.preferredPosition === "GK"){
    return {ok:false, error:"Position modifiers cannot be used on goalkeepers."};
  }
  if(!OUTFIELD_POSITIONS.includes(chosenPosition)){
    return {ok:false, error:"Invalid target position."};
  }
  if(card.preferredPosition === chosenPosition){
    return {ok:false, error:"Card is already this position."};
  }
  const oldPosition = card.preferredPosition;
  card.preferredPosition = chosenPosition;
  stack.quantity -= 1;
  return {ok:true, oldPosition, newPosition:chosenPosition};
}

function renderStatBoostPanel(){
  const body = document.getElementById("statboost-body");
  const card = findCard(selectedCardId);
  const stack = consumables.inventory.find(c => c.itemId === "STAT_BOOST");
  const owned = stack ? stack.quantity : 0;

  if(!card){
    body.innerHTML = '<div class="empty">Select a card from the Club tab first.</div>';
    return;
  }

  if(!card.stats){
    body.innerHTML = '<p class="log err">This card has no stats to boost.</p>';
    return;
  }

  const statOptions = Object.keys(card.stats)
    .map(stat => `<option value="${stat}">${stat} (${card.stats[stat]})</option>`)
    .join("");

  body.innerHTML = `
    <p style="color:var(--muted); font-size:13px; margin-bottom:14px;">
      Selected: <strong style="color:var(--text)">${card.name}</strong> &middot;
      Owned stat boosts: <strong style="color:var(--text)">${owned}</strong>
    </p>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <select id="stat-select">${statOptions}</select>
      <button class="primary" id="boost-btn" ${owned <= 0 ? "disabled" : ""}>Apply +4 boost</button>
    </div>
    <div class="log" id="boost-log"></div>
  `;

  document.getElementById("boost-btn").onclick = () => {
    const chosenStat = document.getElementById("stat-select").value;
    const result = applyStatBoost(card.id, chosenStat);
    const log = document.getElementById("boost-log");
    if(result.ok){
      log.className = "log ok";
      log.textContent = `${result.stat} increased from ${result.oldValue} to ${result.newValue}. Stat boost consumed.`;
    } else {
      log.className = "log err";
      log.textContent = result.error;
    }
    renderClub();
    renderInventory();
    renderStatBoostPanel();
  };
}

function applyStatBoost(cardId, statName){
  const stack = consumables.inventory.find(c => c.itemId === "STAT_BOOST");
  if(!stack || stack.quantity <= 0){
    return {ok:false, error:"No stat boosts available in inventory."};
  }
  const card = findCard(cardId);
  if(!card) return {ok:false, error:"Card not found."};
  if(!card.stats || !(statName in card.stats)){
    return {ok:false, error:"Invalid stat selected."};
  }
  const oldValue = card.stats[statName];
  const newValue = Math.min(99, oldValue + 4);
  card.stats[statName] = newValue;
  stack.quantity -= 1;
  return {ok:true, stat:statName, oldValue, newValue};
}

document.querySelectorAll("nav button[data-view]").forEach(btn => {
  btn.onclick = () => switchView(btn.dataset.view);
});

document.getElementById("reset-progress-btn").onclick = resetProgress;

document.getElementById("play-match-btn").onclick = playMatch;

loadState();
